name: Keep CRM API warm

on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render CRM API
        run: |
          curl -fsS -o /dev/null -w "crm health=%{time_total}s code=%{http_code}\n" \
            "https://dmb-crm-api.onrender.com/health" \
            --max-time 60

      - name: Wake Render Portfolio API (shared Google SSO callback)
        run: |
          curl -fsS -o /dev/null -w "portfolio health=%{time_total}s code=%{http_code}\n" \
            "https://dmbportfolio-api.onrender.com/health" \
            --max-time 60
